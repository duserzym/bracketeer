# Runs on v* tags and by hand only.
name: ci
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - name: Check versions and tag
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const conf = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargo = readFileSync('src-tauri/Cargo.toml', 'utf8').split('[package]')[1].split(/^\[/m)[0].match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (pkg !== conf || pkg !== cargo) throw new Error('Package, Tauri and Cargo versions must agree');
          if (process.env.GITHUB_REF.startsWith('refs/tags/') && process.env.GITHUB_REF_NAME !== `v${pkg}`) throw new Error(`Tag must be v${pkg}`);
          JS
