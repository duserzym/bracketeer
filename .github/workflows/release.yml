# Disabled on GitHub: releases are built and signed by hand on the owner's Mac.
# Re-enable once the TAURI_SIGNING_PRIVATE_KEY secret is set.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  desktop:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-all-crates: true
      - run: cargo install tauri-cli --version '^2' --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tauriScript: cargo tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: true
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: bracketeer ${{ github.ref_name }}
          releaseBody: |
            Download the .dmg for macOS (Apple Silicon) or the NSIS setup .exe for Windows.
            bracketeer-portable.exe needs no install; replace it by hand for updates.
            First launch on macOS: System Settings > Privacy & Security > Open Anyway.
      # Keep the portable instrument copy beside the installer in the draft release.
      - name: Name portable executable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: Copy-Item src-tauri/target/release/bracketeer.exe src-tauri/target/release/bracketeer-portable.exe
      - uses: softprops/action-gh-release@v2
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/release/bracketeer-portable.exe
      - name: Upload builds on manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bracketeer-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app/
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/**/release/bundle/nsis/*.exe*
            src-tauri/target/release/bracketeer*.exe
          if-no-files-found: ignore
